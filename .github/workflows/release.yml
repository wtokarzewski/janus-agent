name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npx vitest run --no-file-parallelism

      - name: Check CHANGELOG has Unreleased content
        run: |
          if ! grep -q '## \[Unreleased\]' CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md missing [Unreleased] section"
            exit 1
          fi

      - name: Bump version
        id: bump
        run: |
          OLD_VERSION=$(node -e "console.log(require('./package.json').version)")
          npm version ${{ inputs.bump_type }} --no-git-tag-version
          NEW_VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "old=$OLD_VERSION" >> "$GITHUB_OUTPUT"
          echo "new=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG
        run: |
          DATE=$(date +%Y-%m-%d)
          VERSION=${{ steps.bump.outputs.new }}
          sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n## [$VERSION] - $DATE/" CHANGELOG.md

      - name: Extract release notes
        id: notes
        run: |
          VERSION=${{ steps.bump.outputs.new }}
          sed -n "/^## \[$VERSION\]/,/^## \[/{/^## \[/!p}" CHANGELOG.md > /tmp/release-notes.md

      - name: Build release tarball
        run: |
          VERSION=${{ steps.bump.outputs.new }}
          PREFIX="janus-v${VERSION}"
          tar czf "/tmp/${PREFIX}.tar.gz" \
            --transform "s,^,${PREFIX}/," \
            --exclude='node_modules' \
            --exclude='tests' \
            --exclude='docs' \
            --exclude='.github' \
            --exclude='.git' \
            --exclude='.janus' \
            --exclude='.claude' \
            --exclude='scripts' \
            --exclude='Dockerfile' \
            --exclude='docker-compose.yml' \
            --exclude='.dockerignore' \
            --exclude='CODING.md' \
            --exclude='CLAUDE.md' \
            src/ skills/ \
            package.json package-lock.json tsconfig.json \
            CHANGELOG.md README.md FEATURES.md AGENTS.md \
            janus.example.json

      - name: Commit and tag
        run: |
          VERSION=${{ steps.bump.outputs.new }}
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin main --follow-tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=${{ steps.bump.outputs.new }}
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file /tmp/release-notes.md \
            "/tmp/janus-v${VERSION}.tar.gz"
