<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      color: #e0e0e0;
      background: #1a1a2e;
      padding: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }
    .status-dot.connected { background: #4ade80; box-shadow: 0 0 6px #4ade80; }
    .status-dot.disconnected { background: #f87171; box-shadow: 0 0 6px #f87171; }
    .status-dot.connecting { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid #2a2a4a;
    }
    .row:last-child { border-bottom: none; }
    .label { color: #9ca3af; }
    .value { color: #fff; font-weight: 500; text-align: right; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }
    .value.ok { color: #4ade80; }
    .value.warn { color: #fbbf24; }
    .value.error { color: #f87171; }
    .section { margin-top: 12px; }
    .section-title { font-size: 11px; text-transform: uppercase; color: #6b7280; letter-spacing: 0.5px; margin-bottom: 6px; }
    .footer { margin-top: 12px; font-size: 11px; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <h1>
    <span id="statusDot" class="status-dot disconnected"></span>
    Janus Browser Operator
  </h1>

  <div class="section">
    <div class="section-title">Connection</div>
    <div class="row"><span class="label">Status</span><span id="connStatus" class="value error">Disconnected</span></div>
    <div class="row"><span class="label">Session</span><span id="sessionId" class="value">—</span></div>
    <div class="row"><span class="label">Last handshake</span><span id="lastHandshake" class="value">—</span></div>
  </div>

  <div class="section">
    <div class="section-title">Runtime</div>
    <div class="row"><span class="label">Policy mode</span><span id="policyMode" class="value">—</span></div>
    <div class="row"><span class="label">Protocol</span><span id="protocol" class="value">—</span></div>
    <div class="row"><span class="label">Capabilities</span><span id="capabilities" class="value">—</span></div>
  </div>

  <div class="section">
    <div class="section-title">Browser</div>
    <div class="row"><span class="label">Active tab</span><span id="activeTab" class="value">—</span></div>
    <div class="row"><span class="label">Extension</span><span id="extVersion" class="value">—</span></div>
  </div>

  <div class="footer">Janus AI Agent · ws://127.0.0.1:19816</div>

  <script src="dist/popup.js"></script>
</body>
</html>
