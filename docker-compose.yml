services:
  janus-gateway:
    build: .
    command: gateway
    volumes:
      - ./janus.json:/home/node/app/janus.json:ro
      - janus-data:/home/node/app/.janus
      - janus-memory:/home/node/app/memory
      - janus-sessions:/home/node/app/sessions
      - ${GOG_CONFIG:-./gog-config}:/home/node/.config/gogcli:ro
    environment:
      - GOG_KEYRING_PASSWORD=${GOG_KEYRING_PASSWORD:-}
      - GOG_ACCOUNT=${GOG_ACCOUNT:-}
    restart: unless-stopped

  janus-cli:
    build: .
    command: ""
    volumes:
      - ./janus.json:/home/node/app/janus.json:ro
      - janus-data:/home/node/app/.janus
      - janus-memory:/home/node/app/memory
      - janus-sessions:/home/node/app/sessions
      - ${GOG_CONFIG:-./gog-config}:/home/node/.config/gogcli:ro
    environment:
      - GOG_KEYRING_PASSWORD=${GOG_KEYRING_PASSWORD:-}
      - GOG_ACCOUNT=${GOG_ACCOUNT:-}
    stdin_open: true
    tty: true
    profiles:
      - cli

volumes:
  janus-data:
  janus-memory:
  janus-sessions:
